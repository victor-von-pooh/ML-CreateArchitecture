[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-createarchitecture"
version = "0.1.0"
description = "ML-ModelControl の部品を GUI で並べてつなぎ, モデルを組み立てるローカルの Web アプリ"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "ml-modelcontrol",
    # PyTorch が読み込むときに無いと警告を出すので入れる
    "numpy>=1.26",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # ML-ModelControl が使う. Linux では下の pytorch-cpu から取る
    "torch>=2.2",
    "uvicorn>=0.32"
]

[project.optional-dependencies]
# 外部のライブラリの部品を使う場合 (ML-ModelControl の任意の依存と同じ.
# all で全て)
geometric = ["ml-modelcontrol[geometric]"]
huggingface = ["ml-modelcontrol[huggingface]"]
torchvision = ["ml-modelcontrol[torchvision]"]
timm = ["ml-modelcontrol[timm]"]
torchaudio = ["ml-modelcontrol[torchaudio]"]
einops = ["ml-modelcontrol[einops]"]
kornia = ["ml-modelcontrol[kornia]"]
monai = ["ml-modelcontrol[monai]"]
smp = ["ml-modelcontrol[smp]"]
all = ["ml-modelcontrol[all]"]
# データセットから入力と出力を作る, プロジェクトに保存する場合 (他の段階の
# ファイルは, その約束を持つ ML-EDA と ML-Quest を通して読む)
project = ["ml-eda", "ml-quest"]

[project.scripts]
ml-createarchitecture = "ml_createarchitecture.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0"
]

[tool.uv.sources]
ml-modelcontrol = { path = "../ML-ModelControl", editable = true }
# 任意の依存 project のライブラリ (main の版を uv.lock で決める)
ml-eda = { git = "https://github.com/victor-von-pooh/ML-EDA.git", branch = "feat/model-inputs" }
ml-quest = { git = "https://github.com/victor-von-pooh/ML-Quest.git" }
# Linux (CI) では CUDA の無い軽い PyTorch を使う
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/ml_createarchitecture"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP007", "UP045"]

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
